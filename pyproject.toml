[project]
name = "product-safety-compliance"
version = "0.1.0"
description = "Compliance screening: forbidden-ingredient index and matching"
requires-python = ">=3.12,<3.13"

# Phase 0 needs nothing. chem / pubchem / index are stdlib only: re, urllib, csv, json.
# Later phases declare their own dependencies when they land, rather than up front.
dependencies = [
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "pydantic>=2.0",
]

[project.optional-dependencies]
vision = ["google-genai>=1.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "python-multipart>=0.0.12"]
# Rendering the evaluation corpus. Restore it with: git checkout <commit> -- eval/
evalset = ["pyyaml>=6.0", "reportlab>=4.2", "pillow>=10.4"]
obs = [
    "arize-phoenix-client>=2.13.0",
    "arize-phoenix-otel>=0.16.1",
    "openinference-instrumentation-google-genai>=1.3.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.ruff.lint]
ignore = ["BLE001"]
