# Evaluation corpus - the source of truth for every test case.
#
# Why this file exists: the 30 provided sample products cannot distinguish a good system
# from a bad one. Ground truth there is 24 Rejected / 6 Accepted, and a vision model plus
# ten lines of case-insensitive string equality scores 30/30, because every banned
# ingredient appears only in the forbidden list's literal surface form. "Benzene",
# "Caffeine", "Hydrogen Peroxide" and "Butylated" occur zero times across all 20
# text-layer products. So PubChem, InChIKey and an LLM judge all measure as worthless on
# the visible data - and the half of the dataset that discriminates was held back.
#
# These cases are the held-back half, reconstructed. Tiers escalate in difficulty:
#   t0_regression  - the provided files. Must stay at 100%.
#   t1_synonym     - same substance, different naming system. Must Reject.
#   t2_near_miss   - lookalikes that are different substances. Must Accept.
#   t3_ocr         - images degraded until OCR corrupts chemical formulas. Must Reject.
#   t4_layout      - real-world label formats, including negation traps. Mixed.
#   t5_adversarial - salt swaps, homoglyphs, decorations, other languages. Mixed.
#   t6_degenerate  - broken input. Must never Accept.
#   t7_lists       - custom forbidden lists, as the README requires. Mixed.
#
# `must_cite` is stricter than the verdict: a system that rejects a product for the wrong
# ingredient scores zero on citation even though its status matched.
#
# Generated once from verified ground truth, then maintained by hand.

