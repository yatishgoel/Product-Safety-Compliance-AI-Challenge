  - id: T4-011
    tier: t4_layout
    # No blank line before the negation block, on purpose. With one, the parser's
    # blank-line-ends-a-block rule already discards it and the case passes even if negation
    # handling is deleted entirely - mutation testing showed all three negation cases were
    # passing for the wrong reason. Butted directly against the list, only real negation
    # handling saves it.
    title: "NEGATION TRAP: 'Formulated without' butted against the list - a substring search rejects the safest product on the shelf"
    format: txt
    product_name: Free From Label
    raw_body: "Product Name: Free From Label\nSKU: T4NEG1\n\nIngredients:\n- Aqua\n- Glycerin\n- Tocopherol\nFormulated without: Formaldehyde, Coumarin, Parabens\n"
    expect:
      status: Accepted
      must_cite: []
    probes: [negation]

